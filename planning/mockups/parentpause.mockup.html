<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParentPause — interactive design prototype</title>
<style>
:root{--paper:#f7f6f2;--ink:#263b35;--muted:#5c6c64;--green:#2f5d50;--line:#d8dfd7;--sage:#eaf0ea;--rust:#843d2e}*{box-sizing:border-box}body{margin:0;background:#e8ebe7;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,textarea,select{font:inherit}button,select{cursor:pointer}button{min-height:44px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 15px}button:hover{border-color:var(--green);background:#f0f4ee}button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #957027;outline-offset:3px}button:disabled{cursor:default;opacity:.6}.review{direction:ltr;background:#263b35;color:white;padding:13px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px}.review strong{font-size:14px}.review small{color:#d6e1d8}.review-controls{display:flex;align-items:center;gap:10px;margin-inline-start:auto;flex-wrap:wrap}.review select{min-height:40px;padding:6px;border-radius:7px;background:#fff}.review button{min-height:40px;font-size:13px}.frame{background:var(--paper);min-height:calc(100vh - 72px);max-width:1600px;margin:0 auto;transition:max-width .2s}.frame.mobile{max-width:390px;box-shadow:0 0 0 1px #bbc4bb}.frame.mobile .bar{padding:20px;flex-wrap:wrap;gap:16px}.frame.mobile main{padding:30px 18px}.frame.mobile h1{font-size:30px}.frame.mobile .composer-bottom{align-items:stretch;flex-direction:column}.frame.mobile .primary{width:100%}.frame.mobile .examples{flex-direction:column}.bar{max-width:1120px;margin:auto;padding:27px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.symbol{display:grid;place-items:center;width:36px;height:36px;background:var(--green);color:white;border-radius:12px;font-size:21px}.wordmark{font-size:19px;font-weight:650;letter-spacing:-.5px}.brand small{display:block;font-size:11px;letter-spacing:.2px;color:var(--muted)}.language{display:flex;gap:3px;background:#eeeee8;padding:3px;border-radius:10px}.language button{border:0;min-width:65px;background:transparent;padding:4px 12px;font-size:14px}.language button[aria-pressed="true"]{background:white;box-shadow:0 1px 3px #263b3515}.skip{position:absolute;top:-100px}.skip:focus{top:80px;background:white;padding:12px;z-index:5}main{max-width:756px;margin:auto;padding:42px 28px 32px}.eyebrow{font-size:12px;letter-spacing:1.7px;text-transform:uppercase;color:var(--green);font-weight:650;margin:0 0 13px}h1{font-size:38px;font-weight:540;line-height:1.2;letter-spacing:-1.25px;margin:0 0 16px}h2{font-size:23px;line-height:1.4;letter-spacing:-.3px;margin:0 0 12px}p{margin:0 0 15px}.intro{color:var(--muted);font-size:16px;max-width:560px}.examples{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0 28px}.examples button{font-size:13px;padding:7px 12px;border-radius:30px;background:transparent;text-align:start}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:24px 0 16px}.section-head span{font-size:12px;color:var(--muted)}.quiet{border:0;background:transparent;color:var(--green);font-size:13px;padding:6px 0;min-height:44px;text-decoration:underline;text-underline-offset:4px}.user{margin:0 0 22px;padding:17px 20px;background:#eeeee8;border-radius:14px;border-start-start-radius:4px}.role{font-size:11px;font-weight:650;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.user p{margin:0}.coach{border:1px solid var(--line);background:#fff;border-radius:17px;padding:24px}.coach .role{color:var(--green);margin-bottom:15px}.steps{list-style:none;padding:0;margin:21px 0;display:grid;gap:15px;counter-reset:steps}.steps li{display:flex;gap:13px;align-items:baseline}.steps li:before{counter-increment:steps;content:counter(steps);display:grid;place-items:center;flex:0 0 25px;height:25px;border-radius:50%;background:var(--sage);color:var(--green);font-size:12px;font-weight:650}.checkin{padding:17px 19px;background:var(--sage);border-radius:10px}.checkin small{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--green);font-weight:650;display:block;margin-bottom:6px}.checkin p{margin:0}.crisis{background:#fff9f5;border-color:#e6c7b8;border-inline-start:4px solid var(--rust)}.crisis h2,.crisis .role{color:var(--rust)}.crisis ul{padding-inline-start:22px;margin:20px 0}.crisis li{margin-bottom:12px}.crisis .checkin{background:#f7e7dc}.crisis .checkin small{color:var(--rust)}.composer{background:#fff;border:1px solid #b7c6bb;border-radius:16px;padding:19px 20px;margin-top:24px;box-shadow:0 3px 12px #293c3205}.composer label{font-size:14px;font-weight:650;display:block;margin-bottom:9px}textarea{width:100%;min-height:107px;border:0;resize:vertical;background:transparent;color:var(--ink);padding:4px 0;line-height:1.7}textarea::placeholder{color:#68786e}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.hint{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}.primary{background:var(--green);color:white;border-color:var(--green);font-size:14px;padding:11px 19px;white-space:normal}.primary:hover{background:#244c40;color:white}.privacy{font-size:11px;line-height:1.7;color:var(--muted);margin:14px 4px 25px}.emergency{border-top:1px solid var(--line);padding-top:19px;font-size:12px;color:var(--muted)}.emergency strong{color:var(--ink)}.status{padding:20px;border:1px dashed #a9b9ac;border-radius:14px;background:#fff}.status p{margin:0}.error{border:1px solid #ddbfa7;background:#fff7ee}.demo-note{font-size:11px;text-align:center;color:var(--muted);padding:10px 20px 22px}.validation{color:var(--rust);font-size:13px;margin-top:8px}dialog{border:1px solid var(--line);border-radius:16px;padding:25px;max-width:min(90vw,430px);color:var(--ink)}dialog::backdrop{background:#263b3544}.dialog-actions{display:flex;gap:10px;justify-content:flex-end}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
[lang="ur"] .frame{font-family:"Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;font-size:18px;line-height:1.95}[lang="ur"] .eyebrow,[lang="ur"] .role,[lang="ur"] .checkin small{letter-spacing:0;text-transform:none}[lang="ur"] h1{letter-spacing:0;line-height:1.6;font-size:34px}[lang="ur"] .intro{font-size:18px}[lang="ur"] textarea{font-size:18px;line-height:1.9}[lang="ur"] .wordmark{font-family:Arial,sans-serif}[lang="ur"] .privacy,[lang="ur"] .emergency{font-size:13px}[lang="ur"] .hint{font-size:12px}
@media(max-width:640px){.review{padding:12px 16px;gap:9px}.review-controls{margin-inline-start:0;width:100%}.bar{padding:20px;flex-wrap:wrap;gap:16px}main{padding:28px 18px}h1{font-size:30px}.composer-bottom{align-items:stretch;flex-direction:column}.primary{width:100%}.coach{padding:19px}.examples{gap:8px}.review small{display:none}[lang="ur"] h1{font-size:29px}}@media(prefers-reduced-motion:reduce){.frame{transition:none}}
</style>
</head>
<body>
<div class="review" lang="en" dir="ltr"><div><strong>ParentPause / Design preview</strong><br><small>Authored examples · no AI connection · Urdu copy awaits review</small></div><div class="review-controls"><label for="screen">Screen</label><select id="screen"><option value="empty">01 · Start</option><option value="plan" selected>02 · Everyday plan</option><option value="crisis">03 · Crisis</option><option value="loading">04 · Loading</option><option value="error">05 · Error</option></select><button id="size" aria-pressed="false">Mobile preview</button></div></div>
<div class="frame" id="frame"><a href="#main" class="skip" id="skip">Skip to conversation</a><header class="bar"><div class="brand"><span class="symbol" aria-hidden="true">Ⅱ</span><div><bdi class="wordmark">ParentPause</bdi><small id="tagline"></small></div></div><div class="language" role="group" aria-label="Interface and reply language"><button id="en" lang="en" dir="ltr" aria-pressed="true">English</button><button id="ur" lang="ur" dir="rtl" aria-pressed="false">اردو</button></div></header><main id="main"></main><div class="demo-note" id="demoNote"></div></div>
<dialog id="clearDialog"><h2 id="clearTitle"></h2><p id="clearBody"></p><div class="dialog-actions"><button id="keep"></button><button id="clear" class="primary"></button></div></dialog>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script>
const copy={en:{tagline:'A little space. A next step.',eyebrow:'For the everyday hard moments',title:'Pause. You don’t have to<br>figure it all out at once.',intro:'Share what’s on your mind. Find a small, practical next step for you and your child.',topics:['Bedtime is a battle','Too much screen time','School mornings are hard'],you:'You',coach:'ParentPause · AI coach',thread:'This conversation',fresh:'New conversation',concern:'My 6-year-old gets upset when it’s time to stop playing and go to bed. We end up arguing every night.',ack:'That sounds tiring. A predictable transition may make tonight feel a little calmer.',steps:['Give a five-minute heads-up before playtime ends.','Offer one small choice: “Would you like to pick your pajamas or tonight’s story?”','Keep the next two steps the same: pajamas, then one story.'],checkLabel:'A small check-in',check:'Which part of bedtime tends to be the hardest?',label:'What’s on your mind?',next:'What happened next?',placeholder:'Tell me a little about what’s happening…',reply:'Replies in English · Urdu input welcome',button:'Make a small plan',send:'Send reply',privacy:'This page keeps your chat only until you reload or clear it. Messages are sent to OpenAI to make a reply. Avoid names and identifying details.',limit:'Everyday support, not medical or legal advice.',urgent:'If anyone is in immediate danger, contact local emergency help. This chat is not monitored.',crisisConcern:'My child says they are going to hurt themselves right now. What should I do?',crisisTitle:'Get support now',crisisAck:'I’m glad you told me. This needs immediate human help; I can’t provide emergency care.',crisisActions:['Contact your local emergency service now. Don’t wait for a reply here.','If safe, ask a trusted person nearby to stay with you or your child.'],crisisCheck:'Can you contact emergency help now?',safety:'Immediate support',loading:'Preparing a short, practical reply…',cancel:'Cancel',error:'We couldn’t make a reliable plan right now. Your message is still here.',retry:'Try again',note:'Interactive design prototype. Buttons show sample states; no messages are sent.',validation:'This preview does not answer typed concerns. Choose a sample screen above to review the design.',clearTitle:'Start a new conversation?',clearBody:'This will clear the conversation shown on this page.',keep:'Keep conversation',clear:'Start new',skip:'Skip to conversation'},ur:{tagline:'ذرا ٹھہریں، اگلا قدم سوچیں',eyebrow:'روزمرہ کی مشکل گھڑیوں میں',title:'ایک لمحہ ٹھہریں۔<br>ہر بات کا حل ابھی ضروری نہیں۔',intro:'اپنی پریشانی بتائیں۔ اپنے اور اپنے بچے کے لیے ایک چھوٹا، عملی قدم تلاش کریں۔',topics:['سونے کے وقت مشکل ہوتی ہے','اسکرین کا وقت بہت زیادہ ہے','اسکول کی صبح مشکل ہوتی ہے'],you:'آپ',coach:'پیرنٹ پاز · اے آئی کوچ',thread:'یہ گفتگو',fresh:'نئی گفتگو',concern:'میرا 6 سال کا بچہ کھیل بند کر کے سونے کے وقت ناراض ہو جاتا ہے۔ ہر رات ہماری بحث ہو جاتی ہے۔',ack:'یہ صورت حال تھکا دینے والی ہو سکتی ہے۔ ایک طے شدہ معمول آج رات کو کچھ پُرسکون بنا سکتا ہے۔',steps:['کھیل ختم ہونے سے پانچ منٹ پہلے بتا دیں۔','ایک چھوٹا انتخاب دیں: «پاجامہ چننا ہے یا آج کی کہانی؟»','اگلے دو قدم روز ایک جیسے رکھیں: پاجامہ، پھر ایک کہانی۔'],checkLabel:'ایک چھوٹا سا سوال',check:'سونے کی تیاری کا کون سا حصہ سب سے مشکل ہوتا ہے؟',label:'آپ کو کیا پریشانی ہے؟',next:'اس کے بعد کیا ہوا؟',placeholder:'تھوڑا سا بتائیں کہ کیا ہو رہا ہے…',reply:'جواب اردو میں ہوگا · انگریزی بھی لکھ سکتے ہیں',button:'ایک چھوٹا منصوبہ بنائیں',send:'جواب بھیجیں',privacy:'یہ گفتگو صرف صفحہ دوبارہ کھولنے یا صاف کرنے تک یہاں رہتی ہے۔ جواب بنانے کے لیے پیغامات OpenAI کو بھیجے جاتے ہیں۔ نام اور شناختی تفصیلات نہ لکھیں۔',limit:'روزمرہ کی مدد، طبی یا قانونی مشورہ نہیں۔',urgent:'اگر کسی کو فوری خطرہ ہے تو مقامی ہنگامی مدد سے رابطہ کریں۔ اس چیٹ کی نگرانی نہیں کی جاتی۔',crisisConcern:'میرا بچہ کہہ رہا ہے کہ وہ ابھی خود کو نقصان پہنچائے گا۔ میں کیا کروں؟',crisisTitle:'ابھی مدد حاصل کریں',crisisAck:'آپ نے بتایا، یہ اہم ہے۔ اس صورت حال میں فوری انسانی مدد کی ضرورت ہے۔ میں ہنگامی مدد فراہم نہیں کر سکتا۔',crisisActions:['ابھی اپنی مقامی ایمرجنسی سروس سے رابطہ کریں۔ یہاں جواب کا انتظار نہ کریں۔','اگر محفوظ ہو تو کسی قابلِ اعتماد قریبی شخص کو اپنے یا اپنے بچے کے پاس رہنے کے لیے بلائیں۔'],crisisCheck:'کیا آپ ابھی ہنگامی مدد سے رابطہ کر سکتے ہیں؟',safety:'فوری مدد',loading:'ایک مختصر، عملی جواب تیار ہو رہا ہے…',cancel:'منسوخ کریں',error:'ابھی قابلِ اعتماد منصوبہ نہیں بن سکا۔ آپ کا پیغام یہیں موجود ہے۔',retry:'دوبارہ کوشش کریں',note:'یہ صرف ڈیزائن کا نمونہ ہے۔ کوئی پیغام نہیں بھیجا جاتا۔',validation:'یہ نمونہ لکھے گئے سوال کا جواب نہیں دیتا۔ ڈیزائن دیکھنے کے لیے اوپر سے نمونہ منتخب کریں۔',clearTitle:'نئی گفتگو شروع کریں؟',clearBody:'اس صفحے پر موجود گفتگو صاف ہو جائے گی۔',keep:'گفتگو جاری رکھیں',clear:'نئی گفتگو',skip:'گفتگو پر جائیں'}};
let locale='en',state='plan',draft='';const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const t=copy[locale];document.documentElement.lang=locale;document.documentElement.dir=locale==='ur'?'rtl':'ltr';$('#en').setAttribute('aria-pressed',String(locale==='en'));$('#ur').setAttribute('aria-pressed',String(locale==='ur'));$('#tagline').textContent=t.tagline;$('#demoNote').textContent=t.note;$('#skip').textContent=t.skip;$('#screen').value=state;const active=state!=='empty';let content=active ? `<h1 class="sr-only">${t.thread}</h1>` : `<p class="eyebrow">${t.eyebrow}</p><h1>${t.title}</h1><p class="intro">${t.intro}</p>`;
if(!active)content+=`<div class="examples">${t.topics.map((s,i)=>`<button type="button" data-topic="${i}">${s}</button>`).join('')}</div>`;
if(active){content+=`<div class="section-head"><span>${t.thread}</span><button class="quiet" id="new">${t.fresh}</button></div><section class="user" aria-label="${t.you}"><div class="role">${t.you}</div><p dir="auto">${state==='crisis'?t.crisisConcern:t.concern}</p></section>`;
if(state==='plan')content+=`<article class="coach"><div class="role">${t.coach}</div><p>${t.ack}</p><ol class="steps">${t.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol><div class="checkin"><small>${t.checkLabel}</small><p>${t.check}</p></div></article>`;
if(state==='crisis')content+=`<article class="coach crisis" role="alert"><div class="role">${t.safety}</div><h2>${t.crisisTitle}</h2><p>${t.crisisAck}</p><ul>${t.crisisActions.map(s=>`<li>${s}</li>`).join('')}</ul><div class="checkin"><small>${t.checkLabel}</small><p>${t.crisisCheck}</p></div></article>`;
if(state==='loading')content+=`<div class="status" role="status"><p>${t.loading}</p><button class="quiet" id="cancel">${t.cancel}</button></div>`;
if(state==='error')content+=`<div class="status error" role="alert"><p>${t.error}</p><button class="quiet" id="retry">${t.retry}</button></div>`;}
const value=draft||((state==='loading'||state==='error')?t.concern:'');content+=`<form class="composer"><label for="concern">${active?t.next:t.label}</label><textarea id="concern" dir="auto" aria-describedby="replyHint count" placeholder="${t.placeholder}">${esc(value)}</textarea><div class="composer-bottom"><div class="hint"><span id="replyHint">${t.reply}</span><span id="count" dir="ltr">${Array.from(value).length} / 2,000</span></div><button class="primary" type="submit" ${state==='loading'?'disabled':''}>${active?t.send:t.button}</button></div><div class="validation" id="validation" role="status"></div></form><p class="privacy">${t.privacy}</p><aside class="emergency"><strong>${t.limit}</strong><br>${t.urgent}</aside>`;$('#main').innerHTML=content;
$('#concern').addEventListener('input',e=>{draft=e.target.value;$('#count').textContent=`${Array.from(draft).length} / 2,000`;});$('.composer').addEventListener('submit',e=>{e.preventDefault();$('#validation').textContent=t.validation;});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{draft=t.topics[+b.dataset.topic];$('#concern').value=draft;$('#count').textContent=`${Array.from(draft).length} / 2,000`;$('#concern').focus();});if($('#new'))$('#new').onclick=()=>{$('#clearTitle').textContent=t.clearTitle;$('#clearBody').textContent=t.clearBody;$('#keep').textContent=t.keep;$('#clear').textContent=t.clear;$('#clearDialog').showModal();};if($('#cancel'))$('#cancel').onclick=()=>{state='empty';draft=value;render();};if($('#retry'))$('#retry').onclick=()=>{state='loading';render();};}
$('#screen').onchange=e=>{state=e.target.value;draft='';render();};$('#en').onclick=()=>{locale='en';render();};$('#ur').onclick=()=>{locale='ur';render();};$('#size').onclick=()=>{const mobile=$('#frame').classList.toggle('mobile');$('#size').setAttribute('aria-pressed',String(mobile));$('#size').textContent=mobile?'Desktop preview':'Mobile preview';};$('#keep').onclick=()=>$('#clearDialog').close();$('#clear').onclick=()=>{$('#clearDialog').close();state='empty';draft='';render();$('#concern').focus();};render();
</script>
</body></html>
